apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: mindaxps/gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8222
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: native
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_HOSTNAME
              value: gateway
            - name: EUREKA_URL
              value: http://discovery-service:8761/eureka/
            - name: INTERNAL_TOKEN
              value: dG9sb3hpbnRlcm5hbHNlY3JldHRva2VuZm9ybWljcm9zZXJ2aWNlcw==
            - name: SERVICE_TOKEN
              value: dG9sb3hpbnRlcm5hbHNlY3JldHRva2VuZm9ybWljcm9zZXJ2aWNlcw==
            - name: JWT_SECRET_KEY
              value: 1x8NbZAgBr91EIKrWcnvLVyTSEOnV6g4efmMp+dIS2k=
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:5173
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8222
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8222
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8222
      targetPort: 8222
      nodePort: 31222
